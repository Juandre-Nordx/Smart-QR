{% extends "base.html" %}
{% block title %}Password updated — QRD{% endblock %}
{% block body_class %}flow-page{% endblock %}
{% block content %}
<section class="login-panel">
  <p class="eyebrow">PASSWORD UPDATED</p>
  <div class="success-mark" aria-hidden="true">✓</div>
  <h1>You’re all set.</h1>
  <p class="password-reset-help">Your password has been changed. You can now log in to your QRD workspace.</p>
  <a class="button password-reset-link" href="{% url 'login' %}">Login to QRD →</a>
</section>
{% endblock %}
